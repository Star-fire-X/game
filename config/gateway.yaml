server:
  id: 1
  name: "Mir2-Gateway"
  bind_ip: "0.0.0.0"
  port: 7000
  udp_port: 7001
  metrics_port: 9090
  io_threads: 4
  max_connections: 5000
  tick_interval_ms: 50
  heartbeat_timeout_ms: 30000
  service_link_write_queue_size: 8192
  network_low_copy_send_enabled: true
  # 登录请求按客户端 IP 做令牌桶限流（capacity + 每秒 refill_rate）
  login_ip_rate_limit_capacity: 5
  login_ip_rate_limit_refill_rate: 1
  # UDP 发送错误注入（每 N 次发送注入 1 次；0=关闭）
  udp_send_fault_inject_every_n: 0
  # 网关生命周期与重试阈值
  gateway_stale_route_cleanup_interval_ms: 30000
  gateway_backpressure_default_pause_ms: 100
  gateway_backpressure_max_pause_ms: 2000
  gateway_max_forward_payload_bytes: 65536
  gateway_disconnect_retry_initial_backoff_ms: 500
  gateway_disconnect_retry_max_backoff_ms: 30000
  gateway_disconnect_retry_ttl_ms: 300000
  gateway_disconnect_retry_max_queue_size: 100000
  gateway_holder_buffer_capacity_bytes: 2097152
  gateway_holder_disconnect_threshold_bytes: 5242880
  gateway_kcp_cleanup_interval_ms: 1000
  gateway_tcp_write_batch_max_bytes: 32768
  gateway_tcp_write_batch_flush_us: 1000

database:
  host: "127.0.0.1"
  port: 5432
  user: "mir2"
  password: "your_password_here"
  database: "mir2_game"
  pool_size: 10

log:
  level: "info"
  path: "logs"
  max_size_mb: 100
  max_files: 10

services:
  logic:
    host: "127.0.0.1"
    port: 8002
    transport: "auto"  # auto|tcp|uds
    uds_path: "/tmp/mir2_logic.sock"
