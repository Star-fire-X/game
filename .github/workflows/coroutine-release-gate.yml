name: Coroutine Release Gate

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  p0-p1-and-metric-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate legacy source gating
        shell: bash
        run: scripts/check_build_sources.sh

      - name: Enforce migration guardrails
        shell: bash
        run: |
          scripts/check_no_legacy_refs.sh
          scripts/check_no_old_handlers_refs.sh
          scripts/check_no_empty_dirs.sh
          scripts/check_link_targets.sh

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [[ ! -d "${VCPKG_ROOT}" ]]; then
            git clone https://github.com/microsoft/vcpkg "${VCPKG_ROOT}"
          fi
          if [[ ! -x "${VCPKG_ROOT}/vcpkg" ]]; then
            "${VCPKG_ROOT}/bootstrap-vcpkg.sh"
          fi

      - name: Configure debug tests
        shell: bash
        run: |
          cmake -S . -B build-release-gate-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_FEATURE_FLAGS=manifests \
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST

      - name: Build legend2_tests (debug)
        shell: bash
        run: cmake --build build-release-gate-debug --target legend2_tests -j"$(nproc)"

      - name: Run P0/P1 test gate
        shell: bash
        run: |
          bash scripts/run-coroutine-release-gate.sh \
            build-release-gate-debug \
            build-release-gate-debug/bin/legend2_tests

      - name: Configure benchmark gate
        shell: bash
        run: |
          cmake -S . -B build-release-gate-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_FEATURE_FLAGS=manifests \
            -DBUILD_BENCHMARKS=ON

      - name: Build benchmark binaries
        shell: bash
        run: |
          cmake --build build-release-gate-bench \
            --target combat_core_benchmark ecs_performance_benchmark \
            -j"$(nproc)"

      - name: Run benchmark metric thresholds
        shell: bash
        run: |
          build-release-gate-bench/bin/combat_core_benchmark \
            --benchmark_format=json \
            --benchmark_out=benchmark_results_combat_core.json \
            --benchmark_min_time=1s
          build-release-gate-bench/bin/ecs_performance_benchmark \
            --benchmark_filter='BM_MigrationHotPath_.*' \
            --benchmark_format=json \
            --benchmark_out=benchmark_results_ecs_hotpath.json \
            --benchmark_min_time=1s
          python3 scripts/check_benchmark.py \
            benchmark_results_combat_core.json \
            benchmark_results_ecs_hotpath.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: coroutine-release-gate-benchmark-results
          path: |
            benchmark_results_combat_core.json
            benchmark_results_ecs_hotpath.json
