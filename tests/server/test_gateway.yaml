server:
  id: 1
  name: "Test-Gateway"
  bind_ip: "127.0.0.1"
  port: 17000
  io_threads: 2
  max_connections: 100
  tick_interval_ms: 50
  heartbeat_timeout_ms: 30000
  network_low_copy_send_enabled: true
  gateway_kcp_cleanup_interval_ms: 1000
  gateway_tcp_write_batch_max_bytes: 32768
  gateway_tcp_write_batch_flush_us: 1000

database:
  host: "127.0.0.1"
  port: 5432
  user: "test"
  password: "test"
  database: "test_db"
  pool_size: 2

log:
  level: "debug"
  path: "test_logs"
  max_size_mb: 10
  max_files: 3

services:
  world:
    host: "127.0.0.1"
    port: 17001
  game:
    host: "127.0.0.1"
    port: 17003
  db:
    host: "127.0.0.1"
    port: 17002
